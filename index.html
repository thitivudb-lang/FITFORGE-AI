<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FITFORGE — AI Workout Planner</title>
<meta name="description" content="ผู้ช่วยวางแผนออกกำลังกายส่วนบุคคล คำนวณ BMI เลือกท่าออกกำลังกายตามเป้าหมาย ระดับ อุปกรณ์ที่มี พร้อมโหมดออกกำลังกายแบบมีไกด์ ตัวจับเวลา และติดตามความก้าวหน้า" />

<!-- ฟอนต์ -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

<!-- สไตล์ทั้งหมด -->
<link rel="stylesheet" href="styles.css" />

<!--
  FITFORGE — standalone, ไม่ต้อง build
  ทำงานฝั่ง client ทั้งหมด: React + ReactDOM (UMD) และ Babel Standalone โหลดจาก cdnjs
  ข้อมูลเก็บใน localStorage ของเบราว์เซอร์นี้เท่านั้น ไม่ส่งไปที่เซิร์ฟเวอร์ใด ๆ
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- โค้ดแอป (JSX) — Babel จะ fetch app.js แล้วแปลงให้เอง -->
<script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
