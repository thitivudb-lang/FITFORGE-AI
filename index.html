  Data is saved to this browser's localStorage only; nothing is sent to any server.
-->

// ===================== window.storage POLYFILL (standalone build) =====================
// The Claude.ai artifact version gets window.storage for free from the platform —
// private, per-account key/value storage. A plain static page has no such backend,
// so this polyfill gives the exact same async get/set/delete/list interface but
// backed by the browser's own localStorage (data stays only on this device/browser).
(function installStoragePolyfill() {
  const PREFIX = "fitforge:";
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem(PREFIX + key);
      if (raw === null) throw new Error("key not found: " + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(PREFIX + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(PREFIX + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX + (prefix || ""))) keys.push(k.slice(PREFIX.length));
      }
      return { keys, prefix, shared: !!shared };
    },
  };
})();

// ===================== SIMPLE LINE CHART (replaces recharts LineChart) =====================
// Minimal SVG line chart: takes {data, dataKey, xKey, color}. No axes library needed —
// just enough to show a weight trend with a couple of labeled points.
function SimpleLineChart({ data, dataKey, xKey = "date", color = "var(--accent)", height = 220 }) {
  if (!data || data.length < 2) return null;
  const width = 600;
  const pad = { l: 34, r: 12, t: 14, b: 26 };
  const values = data.map((d) => Number(d[dataKey]));
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const yFor = (v) => pad.t + (1 - (v - min) / span) * (height - pad.t - pad.b);
  const xFor = (i) => pad.l + (i / (data.length - 1)) * (width - pad.l - pad.r);
  const points = data.map((d, i) => `${xFor(i)},${yFor(Number(d[dataKey]))}`).join(" ");
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height }} preserveAspectRatio="none">
      <line x1={pad.l} y1={pad.t} x2={pad.l} y2={height - pad.b} stroke="var(--border-soft)" />
      <line x1={pad.l} y1={height - pad.b} x2={width - pad.r} y2={height - pad.b} stroke="var(--border-soft)" />
      <text x={4} y={yFor(max) + 4} fontSize="11" fill="var(--text-mute)">{max}</text>
      <text x={4} y={yFor(min) + 4} fontSize="11" fill="var(--text-mute)">{min}</text>
      <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {data.map((d, i) => <circle key={i} cx={xFor(i)} cy={yFor(Number(d[dataKey]))} r="3.5" fill={color} />)}
      <text x={pad.l} y={height - 6} fontSize="11" fill="var(--text-mute)">{data[0][xKey]}</text>
      <text x={width - pad.r} y={height - 6} fontSize="11" fill="var(--text-mute)" textAnchor="end">{data[data.length - 1][xKey]}</text>
    </svg>
  );
}

// ===================== BMI (Asia-Pacific / WHO WPRO classification) =====================
function calcBMI(heightCm, weightKg) {
  const h = Number(heightCm) / 100;
  const w = Number(weightKg);
  if (!h || !w) return null;
  return w / (h * h);
}
function bmiCategory(bmi) {
  if (bmi == null || isNaN(bmi)) return null;
  if (bmi < 18.5) return { label: "น้ำหนักน้อยกว่าเกณฑ์", tone: "info" };
  if (bmi < 23) return { label: "สมส่วน", tone: "success" };
  if (bmi < 25) return { label: "ท้วม / เริ่มเกินเกณฑ์", tone: "warn" };
  if (bmi < 30) return { label: "อ้วนระดับ 1", tone: "danger" };
  return { label: "อ้วนระดับ 2", tone: "danger" };
}

// ===================== VALIDATION =====================
function validateProfile(p) {
  const missing = [];
  if (!p.age || p.age < 13 || p.age > 100) missing.push("อายุ (13-100 ปี)");
  if (!p.gender) missing.push("เพศ");
  if (!p.height || p.height < 100 || p.height > 250) missing.push("ส่วนสูง (100-250 ซม.)");
  if (!p.weight || p.weight < 30 || p.weight > 250) missing.push("น้ำหนัก (30-250 กก.)");
  if (!p.level) missing.push("ระดับประสบการณ์");
  if (!p.goal) missing.push("เป้าหมายการออกกำลังกาย");
  if (!p.bodyParts || p.bodyParts.length === 0) missing.push("ส่วนของร่างกายที่ต้องการเน้น (เลือกอย่างน้อย 1 ส่วน)");
  if (!p.equipment || p.equipment.length === 0) missing.push("อุปกรณ์ที่มี (เลือกอย่างน้อย \"ไม่ใช้อุปกรณ์\")");
  if (!p.daysPerWeek) missing.push("จำนวนวันที่ต้องการออกกำลังกายต่อสัปดาห์");
  if (!p.duration) missing.push("ระยะเวลาในการออกกำลังกายต่อครั้ง");
  return missing;
}

// Expands the "fullbody" selection into every muscle group so both the eligible
// pool and the weekly split draw from all body parts, not just the 5 exercises
// explicitly tagged "fullbody".
function expandBodyParts(bodyParts) {
  const bp = bodyParts || [];
  return bp.includes("fullbody")
    ? ["chest", "back", "shoulders", "arms", "abs", "legs", "fullbody"]
    : bp;
}

// ===================== ELIGIBLE EXERCISE POOL =====================
function getEligibleExercises(bodyParts, level, hasLimitation, equipment, avoidList) {
  const effectiveParts = expandBodyParts(bodyParts);
  const haveEquip = equipment && equipment.length ? equipment : ["none"];
  const avoid = avoidList || [];
  return EXERCISES.filter((ex) => {
    if (!effectiveParts.includes(ex.part)) return false;
    if (DIFFICULTY_RANK[ex.difficulty] > DIFFICULTY_RANK[level]) return false;
    if (hasLimitation && !ex.safeForLimitation) return false;
    if (!ex.equipmentTags.every((tag) => haveEquip.includes(tag))) return false;
    if (avoid.includes(ex.id)) return false;
    return true;
  });
}

// ===================== WEEKLY SPLIT BUILDER =====================
// Distributes selected body parts across the chosen training days per week,
// following the >=2 non-consecutive days/muscle-group guidance from NHS / ACSM.
function buildSplit(daysPerWeek, bodyParts) {
  const parts = bodyParts && bodyParts.length ? bodyParts : ["fullbody"];
  const isFullBody = parts.includes("fullbody");
  const useParts = isFullBody ? expandBodyParts(parts) : parts;

  let template;
  if (isFullBody || daysPerWeek <= 3 || useParts.length <= 2) {
    // Full-body style: every day trains all selected (or expanded) parts
    template = Array.from({ length: daysPerWeek }, () => useParts);
  } else if (daysPerWeek === 4) {
    const mid = Math.ceil(useParts.length / 2);
    const a = useParts.slice(0, mid);
    const b = useParts.slice(mid).length ? useParts.slice(mid) : useParts.slice(0, mid);
    template = [a, b, a, b];
  } else {
    // 5-6 days: rotate through parts in chunks of ~2-3 (push/pull/legs style)
    const chunkSize = Math.max(2, Math.ceil(useParts.length / 3));
    const chunks = [];
    for (let i = 0; i < useParts.length; i += chunkSize) chunks.push(useParts.slice(i, i + chunkSize));
    template = Array.from({ length: daysPerWeek }, (_, i) => chunks[i % chunks.length]);
  }

  const partLabel = (id) => (BODY_PARTS.find((b) => b.id === id) || {}).label || id;
  return template.map((dayParts, i) => ({
    dayIndex: i,
    dayLabel: `วันที่ ${i + 1}`,
    parts: dayParts,
    focus: isFullBody ? "Full Body" : dayParts.map(partLabel).join(" + "),
  }));
}

function exercisesPerDay(durationMin) {
  return Math.max(3, Math.min(8, Math.round(Number(durationMin) / 8)));
}

// Deterministic fallback selector — stable given the same inputs, cycles through the
// eligible pool per day so consecutive days get some variety while staying evidence-based.
function pickExercisesForDay(pool, dayParts, count, dayIndex) {
  const parts = dayParts || [];
  const dayPool = pool.filter((ex) => parts.includes(ex.part));
  const sorted = [...dayPool].sort((a, b) => a.id.localeCompare(b.id));
  if (sorted.length === 0) return [];
  const out = [];
  const offset = (dayIndex * 2) % sorted.length;
  for (let i = 0; i < count && i < sorted.length; i++) {
    out.push(sorted[(offset + i) % sorted.length]);
  }
  return out;
}

function buildDeterministicPlan(profile, split) {
  const pool = getEligibleExercises(profile.bodyParts, profile.level, profile.hasLimitation, profile.equipment, profile.avoidList);
  const perDay = exercisesPerDay(profile.duration);
  return split.map((day) => ({
    ...day,
    exercises: pickExercisesForDay(pool, day.parts, perDay, day.dayIndex).map((ex) => ex.id),
  }));
}

// ===================== DATE / WEEK HELPERS =====================
function getWeekStart(d) {
  const date = new Date(d || new Date());
  const day = date.getDay(); // 0 Sun .. 6 Sat
  const diff = (day === 0 ? -6 : 1) - day; // Monday as week start
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function isThisWeek(dateStr) {
  const d = new Date(dateStr);
  const start = getWeekStart();
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return d >= start && d < end;
}
// Monday-based week key, e.g. "2026-08-10" — used to group completedLog entries by week.
function weekKeyOf(dateStr) {
  return getWeekStart(dateStr).toISOString().slice(0, 10);
}

// ===================== ADHERENCE / STREAK / ACHIEVEMENTS =====================
// All derived purely from completedLog — nothing here is stored separately, so it
// can never drift out of sync with the actual completion history.
function computeAdherenceStats(completedLog, daysPerWeek) {
  const target = Math.max(1, Number(daysPerWeek) || 3);
  const byWeek = {};
  completedLog.forEach((c) => {
    const wk = weekKeyOf(c.date);
    byWeek[wk] = byWeek[wk] || new Set();
    byWeek[wk].add(c.dayIndex + "|" + c.date); // count each real workout day once
  });
  const weekKeys = Object.keys(byWeek).sort(); // ascending
  const weekCounts = weekKeys.map((wk) => byWeek[wk].size);
  const totalCompleted = completedLog.length;
  const bestWeekCompleted = weekCounts.length ? Math.max(...weekCounts) : 0;

  // streakWeeks: consecutive weeks (ending this week, going backward) that hit >=75% of target
  const thisWk = weekKeyOf(new Date().toISOString());
  let streakWeeks = 0;
  let cursor = new Date(thisWk);
  const need = Math.max(1, Math.ceil(target * 0.75));
  // Only count the current week if it's already met; otherwise start from last week
  // so an in-progress week doesn't break a real streak.
  if (!byWeek[weekKeyOf(cursor.toISOString())] || byWeek[weekKeyOf(cursor.toISOString())].size < need) {
    cursor.setDate(cursor.getDate() - 7);
  }
  while (true) {
    const wk = weekKeyOf(cursor.toISOString());
    const count = byWeek[wk] ? byWeek[wk].size : 0;
    if (count >= need) {
      streakWeeks++;
      cursor.setDate(cursor.getDate() - 7);
    } else break;
    if (streakWeeks > 104) break; // safety cap (2 years)
  }
  return { totalCompleted, bestWeekCompleted, streakWeeks, weeksTrained: weekKeys.length };
}

// Progressive overload: every 2 full weeks of consistent training (streakWeeks),
// nudge the displayed rep target up slightly, per NASM/Mayo Clinic progressive-
// overload guidance (SOURCES: nasm, mayo2). This only adjusts what's DISPLAYED —
// it never mutates the sourced SET_REP_TABLE baseline.
function computeProgression(streakWeeks) {
  const steps = Math.min(3, Math.floor((streakWeeks || 0) / 2));
  return { steps, note: steps > 0 ? `เพิ่มเป้าหมายจำนวนครั้งขึ้นเล็กน้อย เพราะฝึกสม่ำเสมอต่อเนื่อง ${streakWeeks} สัปดาห์ (ตามหลัก Progressive Overload)` : "" };
}
function applyProgressionToReps(repsStr, steps) {
  if (!steps) return repsStr;
  const m = /^(\d+)(-(\d+))?/.exec(repsStr);
  if (!m) return repsStr;
  const lo = Number(m[1]);
  const hi = m[3] ? Number(m[3]) : lo;
  return `${lo + steps}-${hi + steps}`;
}
// Session-only pain mitigation: halve the rep target for remaining sets (never
// goes below 1). Does not touch the sourced SET_REP_TABLE baseline.
function applyReduction(repsStr) {
  const m = /^(\d+)(-(\d+))?/.exec(repsStr);
  if (!m) return repsStr;
  const lo = Math.max(1, Math.round(Number(m[1]) / 2));
  const hi = m[3] ? Math.max(lo, Math.round(Number(m[3]) / 2)) : lo;
  return lo === hi ? `${lo}` : `${lo}-${hi}`;
}

// ===================== EXERCISE SWAP =====================
// Alternatives drawn from the same eligible pool, preferring the same movement
// pattern first (closest substitute), excluding exercises already used elsewhere
// that day and the exercise being replaced itself.
function getSwapAlternatives(exerciseId, pool, usedIdsToday) {
  const current = EXERCISES.find((e) => e.id === exerciseId);
  if (!current) return [];
  const used = new Set(usedIdsToday || []);
  const candidates = pool.filter((ex) => ex.id !== exerciseId && !used.has(ex.id));
  const samePattern = candidates.filter((ex) => ex.pattern === current.pattern);
  const rest = candidates.filter((ex) => ex.pattern !== current.pattern);
  return [...samePattern, ...rest].slice(0, 6);
}

  ];

  const safetyNote = profile.hasLimitation
    ? "คุณระบุว่ามีข้อจำกัดทางร่างกาย ระบบเลี่ยงท่าที่มีความเสี่ยงสูงให้แล้ว แต่โปรดปรึกษาแพทย์หรือผู้เชี่ยวชาญก่อนเริ่มโปรแกรมนี้เสมอ"
    : "";

  return { summary, rationale, tips, safetyNote };
}

async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, false);
    if (res && typeof res.value === "string") return JSON.parse(res.value);
    return fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
    return true;
  } catch (e) {
    return false;
  }
}

function Gauge({ pct, value, label }) {
  const clamped = Math.max(0, Math.min(100, pct || 0));
  const style = { background: `conic-gradient(var(--accent) ${clamped * 3.6}deg, var(--surface-3) 0deg)` };
  return (
    <div className="fp-gauge" style={style}>
      <div className="fp-gauge-inner">
        <div className="fp-gauge-num fp-mono">{value}</div>
        <div className="fp-gauge-label">{label}</div>
      </div>
    </div>
  );
}

// ===================== MOVEMENT-PATTERN PICTOGRAM (original geometric icons) =====================
// Small abstract glyphs — not photos — used so exercise cards are scannable at a
// glance without relying on hotlinked third-party images.
const PATTERN_LABEL = { push: "ท่าดัน", pull: "ท่าดึง", squat: "ท่าย่อ/สควอท", hinge: "ท่าก้ม-เหยียดสะโพก", core: "แกนกลางลำตัว", raise: "ท่ายกแขน", dynamic: "เคลื่อนไหวต่อเนื่อง" };

function PatternIcon({ pattern, size = 22 }) {
  const common = { width: size, height: size, viewBox: "0 0 40 40", fill: "none", stroke: "currentColor", strokeWidth: 2.6, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (pattern) {
    case "push":
      return (<svg {...common}><line x1="9" y1="20" x2="9" y2="20" /><line x1="9" y1="10" x2="9" y2="30" /><line x1="12" y1="20" x2="30" y2="20" /><polyline points="23,13 30,20 23,27" /></svg>);
    case "pull":
      return (<svg {...common}><line x1="31" y1="10" x2="31" y2="30" /><line x1="28" y1="20" x2="10" y2="20" /><polyline points="17,13 10,20 17,27" /></svg>);
    case "squat":
      return (<svg {...common}><polyline points="9,12 20,30 31,12" /></svg>);
    case "hinge":
      return (<svg {...common}><polyline points="12,8 12,22 31,30" /></svg>);
    case "core":
      return (<svg {...common}><rect x="7" y="17" width="26" height="6" rx="3" /><circle cx="20" cy="20" r="2.6" fill="currentColor" stroke="none" /></svg>);
    case "raise":
      return (<svg {...common}><line x1="10" y1="31" x2="27" y2="10" /><polyline points="17,10 27,10 27,20" /></svg>);
    case "dynamic":
      return (<svg {...common} strokeWidth="0"><path d="M20 5 L11 21 L18 21 L15 35 L30 16 L21 16 Z" fill="currentColor" /></svg>);
    default:
      return (<svg {...common}><circle cx="20" cy="20" r="10" /></svg>);
  }
}

        <div><div className="fp-ex-stat-num fp-mono">{sr.restSec}s</div><div className="fp-ex-stat-label">พักระหว่างเซต</div></div>

  );
}

// ===================== DASHBOARD =====================
function DashboardView({ profile, bmi, bmiCat, isProfileComplete, plan, split, completedLog, setView, onMarkComplete, onStartSession, adherenceStats }) {
  const weekCompleted = completedLog.filter((c) => isThisWeek(c.date)).length;
  const totalDays = split.length || Number(profile.daysPerWeek) || 0;
  const pct = totalDays ? Math.min(100, Math.round((weekCompleted / totalDays) * 100)) : 0;
  const nextDay = plan.find((d) => !completedLog.some((c) => c.dayIndex === d.dayIndex && isThisWeek(c.date)));
  const goalLabel = (GOALS.find((g) => g.id === profile.goal) || {}).label || "-";
  const levelLabel = (LEVELS.find((l) => l.id === profile.level) || {}).label || "-";
  const gaugePct = bmi ? Math.min(100, Math.max(0, ((bmi - 15) / (35 - 15)) * 100)) : 0;

  return (
    <div className="fp-fade-in">
      <div className="fp-page-head">
        <div>
          <h1 className="fp-page-title">{profile.name ? `สวัสดี, ${profile.name}` : "Dashboard"}</h1>
          <div className="fp-page-sub">ภาพรวมสุขภาพและโปรแกรมออกกำลังกายของคุณ</div>
        </div>
      </div>

        <div className="fp-card" style={{ marginBottom: 20, borderColor: "var(--accent-border)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
            <AlertTriangle size={20} color="var(--accent-2)" />
            <div style={{ flex: 1, minWidth: 220 }}>
              <div style={{ fontWeight: 700, marginBottom: 3 }}>กรอกข้อมูลส่วนตัวให้ครบก่อนเริ่มใช้งาน</div>
              <div style={{ fontSize: 13, color: "var(--text-dim)" }}>
                ระบบต้องใช้ส่วนสูง น้ำหนัก อายุ เพศ และเป้าหมาย เพื่อสร้างโปรแกรมที่เหมาะกับคุณโดยเฉพาะ

            <button className="fp-btn fp-btn-primary" onClick={() => setView("profile")}>

          <Gauge pct={gaugePct} value={bmi ? bmi.toFixed(1) : "--"} label="BMI" />
          <div>
            <div className="fp-card-title" style={{ marginBottom: 8 }}><Ruler size={14} /> BMI (เกณฑ์เอเชีย)</div>
            {bmiCat ? (

            <div style={{ fontSize: 11.5, color: "var(--text-mute)", marginTop: 8, lineHeight: 1.5 }}>
              คัดกรองเบื้องต้นเท่านั้น ไม่ใช่การวินิจฉัย
            </div>
          </div>
        </div>
        <div className="fp-card">
          <div className="fp-card-title"><Target size={14} /> เป้าหมาย & ระดับ</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div><span className="fp-badge fp-badge-accent">{goalLabel}</span></div>
            <div><span className="fp-badge fp-badge-neutral">ระดับ: {levelLabel}</span></div>
          </div>
        </div>
        <div className="fp-card">
          <div className="fp-card-title"><ClipboardList size={14} /> ความคืบหน้าสัปดาห์นี้</div>

        <div className="fp-card" style={{ marginTop: 20 }}>
          <div className="fp-card-title"><Trophy size={14} /> ความสม่ำเสมอ</div>

            <div><div className="fp-stat-num fp-mono">{adherenceStats.streakWeeks}</div><div className="fp-stat-label">สัปดาห์ต่อเนื่อง</div></div>
            <div><div className="fp-stat-num fp-mono">{adherenceStats.totalCompleted}</div><div className="fp-stat-label">Workout สะสม</div></div>
          </div>
          <button className="fp-btn fp-btn-ghost fp-btn-sm" style={{ marginTop: 12 }} onClick={() => setView("progress")}>ดูความสำเร็จทั้งหมด <ChevronRight size={13} /></button>

        <Info size={15} />
        <span>
          เว็บไซต์นี้ให้ข้อมูลทั่วไปเพื่อการออกกำลังกาย ไม่ใช่คำแนะนำทางการแพทย์ ไม่วินิจฉัยหรือรักษาโรค
          และไม่รับประกันผลลัพธ์ด้านสุขภาพหรือน้ำหนัก หากมีอาการบาดเจ็บหรือโรคประจำตัว โปรดปรึกษาแพทย์หรือผู้เชี่ยวชาญก่อนเริ่มโปรแกรม
        </span>
      </div>
    </div>
  );
}

// ===================== PROFILE =====================
function ProfileView({ draft, setDraft, onSave, bmi, bmiCat, showToast }) {
  function update(field, value) { setDraft({ ...draft, [field]: value }); }
  function submit() {
    const errs = [];
    if (!draft.age || draft.age < 13 || draft.age > 100) errs.push("อายุ");
    if (!draft.gender) errs.push("เพศ");
    if (!draft.height || draft.height < 100 || draft.height > 250) errs.push("ส่วนสูง");
    if (!draft.weight || draft.weight < 30 || draft.weight > 250) errs.push("น้ำหนัก");
    if (errs.length) { showToast("ตรวจสอบข้อมูล: " + errs.join(", ")); return; }
    onSave(draft);
  }
  const gaugePct = bmi ? Math.min(100, Math.max(0, ((bmi - 15) / (35 - 15)) * 100)) : 0;
  return (
    <div className="fp-fade-in">
      <div className="fp-page-head">
        <div><h1 className="fp-page-title">Profile</h1><div className="fp-page-sub">ข้อมูลส่วนตัวใช้คำนวณ BMI และปรับโปรแกรมให้เหมาะกับคุณ</div></div>
      </div>
      <div className="fp-grid fp-grid-2">
        <div className="fp-card">
          <div className="fp-field">
            <label className="fp-label">ชื่อเล่น (ไม่บังคับ)</label>
            <input className="fp-input" value={draft.name} onChange={(e) => update("name", e.target.value)} placeholder="เช่น ต้น" />
          </div>
          <div className="fp-grid fp-grid-2">
            <div className="fp-field">
              <label className="fp-label">อายุ (ปี) *</label>
              <input className="fp-input" type="number" value={draft.age} onChange={(e) => update("age", e.target.value)} placeholder="เช่น 25" />
            </div>
            <div className="fp-field">
              <label className="fp-label">เพศ *</label>
              <select className="fp-select" value={draft.gender} onChange={(e) => update("gender", e.target.value)}>
                <option value="">เลือกเพศ</option>
                <option value="male">ชาย</option>
                <option value="female">หญิง</option>
                <option value="other">ไม่ระบุ</option>
              </select>
            </div>
          </div>
          <div className="fp-grid fp-grid-2">
            <div className="fp-field">
              <label className="fp-label">ส่วนสูง (ซม.) *</label>
              <input className="fp-input" type="number" value={draft.height} onChange={(e) => update("height", e.target.value)} placeholder="เช่น 170" />
            </div>
            <div className="fp-field">
              <label className="fp-label">น้ำหนัก (กก.) *</label>
              <input className="fp-input" type="number" value={draft.weight} onChange={(e) => update("weight", e.target.value)} placeholder="เช่น 65" />
            </div>
          </div>
          {draft.age && Number(draft.age) < 18 && (
            <div className="fp-hint" style={{ marginBottom: 12 }}>
              ผู้ที่อายุต่ำกว่า 18 ปี ควรออกกำลังกายภายใต้คำแนะนำของผู้ปกครองหรือผู้เชี่ยวชาญ
            </div>
          )}
          <button className="fp-btn fp-btn-primary fp-btn-block" onClick={submit}><Save size={16} /> บันทึกข้อมูล</button>
        </div>
        <div className="fp-card" style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
          <Gauge pct={gaugePct} value={bmi ? bmi.toFixed(1) : "--"} label="BMI" />
          {bmiCat ? (
            <span className={`fp-badge fp-badge-${bmiCat.tone}`}>{bmiCat.label}</span>
          ) : (
            <span className="fp-badge fp-badge-neutral">กรอกส่วนสูง/น้ำหนัก</span>
          )}
          <div style={{ fontSize: 12, color: "var(--text-mute)", textAlign: "center", lineHeight: 1.6, maxWidth: 240 }}>
            ใช้เกณฑ์ WHO Asia-Pacific (18.5 / 23 / 25 / 30) ซึ่งเหมาะสำหรับประชากรเอเชีย เป็นเครื่องมือคัดกรองเบื้องต้น ไม่ใช่การวินิจฉัยทางการแพทย์
          </div>
        </div>
      </div>
    </div>
  );
}

// ===================== SETUP =====================
function SetupView({ draft, setDraft, onSave, onGenerate, aiStatus, missing }) {
  const bodyParts = draft.bodyParts || [];
  const equipment = draft.equipment || [];
  function update(field, value) { const next = { ...draft, [field]: value }; setDraft(next); onSave(next); }
  function toggleBodyPart(id) {
    const has = bodyParts.includes(id);
    const next = has ? bodyParts.filter((p) => p !== id) : [...bodyParts, id];
    update("bodyParts", next);
  }
  function toggleEquipment(id) {
    const has = equipment.includes(id);
    const next = has ? equipment.filter((e) => e !== id) : [...equipment, id];
    update("equipment", next);
  }
  return (
    <div className="fp-fade-in">
      <div className="fp-page-head">
        <div><h1 className="fp-page-title">Workout Setup</h1><div className="fp-page-sub">เลือกส่วนที่ต้องการเน้น เป้าหมาย และรูปแบบการฝึกของคุณ</div></div>
      </div>

      {missing.length > 0 && (
        <div className="fp-error-box"><b>ข้อมูลยังไม่ครบ:</b> กรุณากรอก {missing.join(", ")} ก่อนสร้างโปรแกรม</div>
      )}

      <div className="fp-card" style={{ marginBottom: 16 }}>
        <div className="fp-card-title"><Target size={14} /> เป้าหมายการออกกำลังกาย</div>
        <div className="fp-chip-group">
          {GOALS.map((g) => {
            const Icon = GOAL_ICONS[g.icon];
            return (
              <div key={g.id} className={"fp-chip" + (draft.goal === g.id ? " selected" : "")} onClick={() => update("goal", g.id)}>
                <Icon size={15} /> {g.label}
              </div>
            );
          })}
        </div>
      </div>

      <div className="fp-card" style={{ marginBottom: 16 }}>
        <div className="fp-card-title"><Dumbbell size={14} /> ระดับประสบการณ์</div>
        <div className="fp-chip-group">
          {LEVELS.map((l) => (
            <div key={l.id} className={"fp-chip" + (draft.level === l.id ? " selected" : "")} onClick={() => update("level", l.id)}>{l.label}</div>
          ))}
        </div>
      </div>

      <div className="fp-card" style={{ marginBottom: 16 }}>
        <div className="fp-card-title"><ClipboardList size={14} /> ส่วนของร่างกายที่ต้องการเน้น (เลือกได้หลายส่วน)</div>
        <div className="fp-chip-group">
          {BODY_PARTS.map((b) => (
            <div key={b.id} className={"fp-chip" + (bodyParts.includes(b.id) ? " selected" : "")} onClick={() => toggleBodyPart(b.id)}>{b.label}</div>
          ))}
        </div>
      </div>

      <div className="fp-card" style={{ marginBottom: 16 }}>
        <div className="fp-card-title"><Wrench size={14} /> อุปกรณ์ที่มี (เลือกเพิ่มเติมจากตัวเปล่า)</div>
        <div className="fp-chip-group">
          <div className="fp-chip selected" style={{ cursor: "default", opacity: 0.75 }}>ไม่ใช้อุปกรณ์ (รวมเสมอ)</div>
          {EQUIPMENT.filter((e) => e.id !== "none").map((e) => (
            <div key={e.id} className={"fp-chip" + (equipment.includes(e.id) ? " selected" : "")} onClick={() => toggleEquipment(e.id)}>{e.label}</div>
          ))}

        <div className="fp-hint" style={{ marginTop: 10 }}>

  const sr0 = (SET_REP_TABLE[profile.goal] && SET_REP_TABLE[profile.goal][profile.level]) || { sets: 3, reps: "10-12", restSec: 60 };
  const sr = { ...sr0, reps: applyProgressionToReps(sr0.reps, progression.steps) };
  const goalLabel = (GOALS.find((g) => g.id === profile.goal) || {}).label || "-";
  const levelLabel = (LEVELS.find((l) => l.id === profile.level) || {}).label || "-";
  return (
    <div className="fp-print-only">
      <div style={{ marginBottom: 20 }}>
        <div className="fp-display" style={{ fontSize: 30 }}>FITFORGE — โปรแกรมออกกำลังกายรายสัปดาห์</div>
        <div style={{ fontSize: 13, color: "var(--text-dim)" }}>
          {profile.name ? `${profile.name} • ` : ""}เป้าหมาย: {goalLabel} • ระดับ: {levelLabel} • {plan.length} วัน/สัปดาห์ • {sr.sets} เซต x {sr.reps} ครั้ง • พัก {sr.restSec} วินาที

          <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 10, borderBottom: "2px solid var(--border)", paddingBottom: 6 }}>
            {day.dayLabel} — {day.focus}
          </div>
          {day.exercises.map((exId) => {
            const ex = EXERCISES.find((e) => e.id === exId);
            if (!ex) return null;
            const source = SOURCES.find((s) => s.id === ex.sourceId);
            return (
              <div key={exId} className="fp-ex-card" style={{ marginBottom: 10 }}>
                <div style={{ fontWeight: 700, fontSize: 14.5 }}>{ex.name}</div>
                <div style={{ fontSize: 12, color: "var(--text-dim)", marginBottom: 6 }}>{ex.primary} • {sr.sets} เซต x {sr.reps} ครั้ง • พัก {sr.restSec} วินาที</div>

// ===================== GUIDED SESSION MODE =====================
// Full-screen guided flow: warm-up -> per-exercise sets with a rest timer -> quick
// log -> cool-down -> done. All numbers shown here (sets/reps/rest) still come from
// the same sourced SET_REP_TABLE as the rest of the app; progressive overload only
// nudges the displayed rep target, and pain-reporting only swaps/reduces — neither
// ever invents a new exercise or a made-up number.
function SessionView({ day, profile, pool, adherenceStats, onExit, onSwap, onLogExercise, onFlagPain, onFinish }) {
  const [phase, setPhase] = useState(day.exercises.length === 0 ? "cooldown" : "warmup"); // warmup | exercise | rest | log | cooldown | done
  const [stepIdx, setStepIdx] = useState(0); // warmup/cooldown move index
  const [exIdx, setExIdx] = useState(0);
  const [setNum, setSetNum] = useState(1);
  const [secondsLeft, setSecondsLeft] = useState(day.exercises.length === 0 ? COOLDOWN_MOVES[0].seconds : WARMUP_MOVES[0].seconds);
  const [running, setRunning] = useState(true);
  const [showPainPanel, setShowPainPanel] = useState(false);
  const [reducedIds, setReducedIds] = useState([]); // session-only rep reduction
  const [logWeight, setLogWeight] = useState("");
  const [confirmExit, setConfirmExit] = useState(false);

  const sr0 = (SET_REP_TABLE[profile.goal] && SET_REP_TABLE[profile.goal][profile.level]) || { sets: 3, reps: "10-12", restSec: 60 };
  const progression = computeProgression(adherenceStats.streakWeeks);
  const currentExId = day.exercises[exIdx];
  const currentEx = EXERCISES.find((e) => e.id === currentExId);
  const isReduced = reducedIds.includes(currentExId);
  const displayReps = isReduced
    ? applyReduction(sr0.reps)
    : applyProgressionToReps(sr0.reps, progression.steps);
  const sr = { ...sr0, reps: displayReps };

  useEffect(() => {
    if (!running || secondsLeft <= 0) return;
    const t = setTimeout(() => setSecondsLeft((s) => s - 1), 1000);
    return () => clearTimeout(t);
  }, [running, secondsLeft]);

  useEffect(() => {
    if (running && secondsLeft === 0 && (phase === "warmup" || phase === "rest" || phase === "cooldown")) {
      advance();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [secondsLeft, running, phase]);

  function advance() {
    if (phase === "warmup") {
      if (stepIdx < WARMUP_MOVES.length - 1) {
        setStepIdx(stepIdx + 1);
        setSecondsLeft(WARMUP_MOVES[stepIdx + 1].seconds);
      } else {
        setPhase("exercise");
        setRunning(false);
      }
    } else if (phase === "rest") {
      setPhase("exercise");
      setRunning(false);
    } else if (phase === "cooldown") {
      if (stepIdx < COOLDOWN_MOVES.length - 1) {
        setStepIdx(stepIdx + 1);
        setSecondsLeft(COOLDOWN_MOVES[stepIdx + 1].seconds);
      } else {
        setPhase("done");
        setRunning(false);
      }
    }
  }

  function skipTimer() {
    setSecondsLeft(0);
    advance();
  }

  function completeSet() {
    if (setNum < sr.sets) {
      setSetNum(setNum + 1);
      setPhase("rest");
      setSecondsLeft(sr0.restSec);
      setRunning(true);
    } else {
      setPhase("log");
    }
  }

  function confirmLog() {
    onLogExercise({
      exerciseId: currentExId, dayIndex: day.dayIndex,
      weightKg: logWeight ? Number(logWeight) : null, sets: sr.sets, reps: sr.reps,
    });
    setLogWeight("");
    setSetNum(1);
    if (exIdx < day.exercises.length - 1) {
      setExIdx(exIdx + 1);
      setPhase("exercise");
    } else {
      setStepIdx(0);
      setSecondsLeft(COOLDOWN_MOVES[0].seconds);
      setRunning(true);
      setPhase("cooldown");
    }
  }

  function handlePainSwap() {
    const alts = getSwapAlternatives(currentExId, pool, day.exercises);
    onFlagPain(currentExId);
    if (alts.length > 0) {
      onSwap(currentExId, alts[0].id);
    }
    setShowPainPanel(false);
    setSetNum(1);
    setPhase("exercise");
    setRunning(false);
  }
  function handlePainReduce() {
    onFlagPain(currentExId);
    setReducedIds((r) => (r.includes(currentExId) ? r : [...r, currentExId]));
    setShowPainPanel(false);
  }

  const totalSteps = 1 + day.exercises.length + 1; // warmup + exercises + cooldown, rough
  const currentStepNum = phase === "warmup" ? 1 : phase === "cooldown" || phase === "done" ? totalSteps : 1 + exIdx + 1;

  return (
    <div className="fp-session">
      <div className="fp-session-head">
        {confirmExit ? (
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <span style={{ fontSize: 12.5, color: "var(--text-dim)" }}>ออกจากเซสชันเลย?</span>
            <button className="fp-btn fp-btn-ghost fp-btn-sm" onClick={() => setConfirmExit(false)}>ยกเลิก</button>
            <button className="fp-btn fp-btn-primary fp-btn-sm" onClick={onExit}>ออก</button>
          </div>
        ) : (
          <button className="fp-session-exit" onClick={() => setConfirmExit(true)}><X size={16} /> ออก</button>
        )}
        <span className="fp-session-progress">{day.dayLabel} • {currentStepNum}/{totalSteps}</span>
      </div>

      {phase === "warmup" && (
        <div className="fp-session-stage fp-fade-in">วอร์มอัพ</div>
      )}
      {(phase === "exercise" || phase === "rest" || phase === "log") && (
        <div className="fp-session-stage fp-fade-in">ท่าที่ {exIdx + 1} จาก {day.exercises.length}</div>
      )}
      {phase === "cooldown" && <div className="fp-session-stage fp-fade-in">คูลดาวน์</div>}

      {phase === "warmup" && (
        <div className="fp-session-card fp-fade-in">
          <div className="fp-session-icon-big"><PatternIcon pattern="dynamic" size={30} /></div>
          <div className="fp-session-name">{WARMUP_MOVES[stepIdx].name}</div>
          <div style={{ color: "var(--text-dim)", fontSize: 13.5 }}>{WARMUP_MOVES[stepIdx].how}</div>
          <div className="fp-timer-ring" style={{ background: `conic-gradient(var(--accent) ${(1 - secondsLeft / WARMUP_MOVES[stepIdx].seconds) * 360}deg, var(--surface-3) 0deg)` }}>
            <div className="fp-timer-inner"><div className="fp-timer-num fp-mono">{secondsLeft}</div><div className="fp-timer-lbl">วินาที</div></div>
          </div>
          <button className="fp-btn fp-btn-ghost" onClick={skipTimer}><SkipForward size={15} /> ข้าม</button>
        </div>
      )}

      {phase === "cooldown" && (
        <div className="fp-session-card fp-fade-in">
          <div className="fp-session-icon-big"><PatternIcon pattern="core" size={30} /></div>
          <div className="fp-session-name">{COOLDOWN_MOVES[stepIdx].name}</div>
          <div style={{ color: "var(--text-dim)", fontSize: 13.5 }}>{COOLDOWN_MOVES[stepIdx].how}</div>
          <div className="fp-timer-ring" style={{ background: `conic-gradient(var(--accent) ${(1 - secondsLeft / COOLDOWN_MOVES[stepIdx].seconds) * 360}deg, var(--surface-3) 0deg)` }}>
            <div className="fp-timer-inner"><div className="fp-timer-num fp-mono">{secondsLeft}</div><div className="fp-timer-lbl">วินาที</div></div>
          </div>
          <button className="fp-btn fp-btn-ghost" onClick={skipTimer}><SkipForward size={15} /> ข้าม</button>
        </div>
      )}

      {phase === "rest" && (
        <div className="fp-session-card fp-fade-in">
          <div className="fp-session-name">พักระหว่างเซต</div>
          <div style={{ color: "var(--text-dim)", fontSize: 13.5 }}>ท่าถัดไป: เซต {setNum}/{sr.sets} — {currentEx ? currentEx.name : ""}</div>
          <div className="fp-timer-ring" style={{ background: `conic-gradient(var(--accent) ${(1 - secondsLeft / sr0.restSec) * 360}deg, var(--surface-3) 0deg)` }}>
            <div className="fp-timer-inner"><div className="fp-timer-num fp-mono">{secondsLeft}</div><div className="fp-timer-lbl">วินาที</div></div>
          </div>
          <button className="fp-btn fp-btn-ghost" onClick={skipTimer}><SkipForward size={15} /> ข้ามพัก</button>
        </div>
      )}

      {phase === "exercise" && currentEx && (
        <div className="fp-session-card fp-fade-in">
          <div className="fp-session-icon-big"><PatternIcon pattern={currentEx.pattern} size={30} /></div>
          <div className="fp-session-name">{currentEx.name}</div>
          <div style={{ color: "var(--text-dim)", fontSize: 13 }}>{currentEx.primary}</div>
          {isReduced && <span className="fp-badge fp-badge-warn">ลดจำนวนครั้งลงให้แล้ว</span>}
          {!isReduced && progression.steps > 0 && <span className="fp-badge fp-badge-success">เพิ่มเป้าหมายขึ้นเล็กน้อย (ฝึกต่อเนื่อง {adherenceStats.streakWeeks} สัปดาห์)</span>}
          <div className="fp-session-setinfo">
            <div><div className="fp-num">{setNum}/{sr.sets}</div><div className="fp-lbl">เซต</div></div>
            <div><div className="fp-num">{sr.reps}</div><div className="fp-lbl">ครั้ง</div></div>
          </div>
          <ol className="fp-ex-steps" style={{ textAlign: "left" }}>
            {currentEx.how.map((s, i) => <li key={i}>{s}</li>)}
          </ol>
          <div className="fp-session-actions">
            <button className="fp-btn fp-btn-primary fp-btn-block" onClick={completeSet}><CheckCircle2 size={16} /> ทำเซตนี้เสร็จแล้ว</button>
            {!showPainPanel && <button className="fp-session-hurt" onClick={() => setShowPainPanel(true)}><AlertTriangle size={13} /> ท่านี้ทำให้เจ็บ?</button>}
            {showPainPanel && (
              <div className="fp-pain-panel fp-fade-in">
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>เจ็บตอนทำท่านี้ใช่ไหม? เลือกวิธีจัดการ:</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <button className="fp-btn fp-btn-soft" onClick={handlePainSwap}><Repeat size={14} /> สลับเป็นท่าอื่นให้เลย</button>
                  <button className="fp-btn fp-btn-soft" onClick={handlePainReduce}><Minus size={14} /> ลดจำนวนครั้งที่เหลือลงครึ่งหนึ่ง</button>
                  <button className="fp-btn fp-btn-ghost fp-btn-sm" onClick={() => setShowPainPanel(false)}>ยกเลิก</button>
                </div>
                <div className="fp-hint" style={{ marginTop: 10 }}>ท่านี้จะถูกจดจำไว้ ระบบจะไม่แนะนำท่านี้ให้อีกในโปรแกรมถัดไป</div>
              </div>
            )}
          </div>
        </div>
      )}

      {phase === "log" && currentEx && (
        <div className="fp-session-card fp-fade-in">
          <CheckCircle2 size={34} color="var(--success)" />
          <div className="fp-session-name">ทำ {currentEx.name} ครบแล้ว!</div>
          <div style={{ fontSize: 13, color: "var(--text-dim)" }}>บันทึกน้ำหนักที่ใช้ (ถ้ามี) เพื่อดูกราฟความก้าวหน้าภายหลัง</div>
          <div className="fp-log-row">
            <div className="fp-field" style={{ marginBottom: 0, flex: 1 }}>
              <label className="fp-label">น้ำหนักที่ใช้ (กก., ไม่บังคับ)</label>
              <input className="fp-input" type="number" value={logWeight} onChange={(e) => setLogWeight(e.target.value)} placeholder="เช่น 10" />
            </div>
          </div>
          <div className="fp-session-actions">
            <button className="fp-btn fp-btn-primary fp-btn-block" onClick={confirmLog}>
              {exIdx < day.exercises.length - 1 ? <>ท่าถัดไป <ChevronRight size={16} /></> : <>ไปคูลดาวน์ <ChevronRight size={16} /></>}
            </button>
          </div>
        </div>
      )}

      {phase === "done" && (
        <div className="fp-session-done fp-fade-in">
          <Trophy size={48} color="var(--accent-2)" />
          <div className="fp-page-title" style={{ fontSize: 28 }}>เยี่ยมมาก! จบ Workout แล้ว</div>
          <div style={{ color: "var(--text-dim)", fontSize: 14 }}>{day.dayLabel} — {day.exercises.length} ท่า เสร็จสมบูรณ์</div>
          <button className="fp-btn fp-btn-primary" onClick={onFinish}><CheckCircle2 size={16} /> เสร็จสิ้น</button>
        </div>
      )}

      <div className="fp-disclaimer" style={{ marginTop: 24 }}>
        <Info size={15} />
        <span>หากรู้สึกเจ็บผิดปกติ เวียนศีรษะ หรือแน่นหน้าอกระหว่างออกกำลังกาย ให้หยุดทันทีและปรึกษาแพทย์</span>
      </div>
    </div>
  );
}

// ===================== WELCOME / ONBOARDING =====================
// Not a real authentication system — there is no backend here to verify a
// password against, and each person's data is already private to their own
// account via window.storage. This is a one-time "welcome" gate that just
// personalizes the app and marks onboarding as done.
function LoginView({ onContinue }) {
  const [name, setName] = useState("");
  return (
    <div className="fp-login-shell">
      <div className="fp-login-card fp-fade-in">
        <div className="fp-login-mark"><Dumbbell size={28} /></div>
        <div className="fp-login-title">FITFORGE</div>
        <div className="fp-login-sub">ผู้ช่วยวางแผนออกกำลังกายส่วนบุคคลด้วย AI<br />พร้อมโปรแกรม วอร์มอัพ และติดตามความก้าวหน้าครบวงจร</div>
        <div className="fp-field">
          <label className="fp-label">ชื่อเล่นของคุณ (ไม่บังคับ)</label>
          <input
            className="fp-input" value={name} placeholder="เช่น ต้น"
            onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") onContinue(name); }}
          />
        </div>
        <button className="fp-btn fp-btn-primary fp-btn-block" onClick={() => onContinue(name)}>
          เริ่มต้นใช้งาน <ChevronRight size={16} />
        </button>
        <div className="fp-hint" style={{ textAlign: "center", marginTop: 16, lineHeight: 1.6 }}>
          ข้อมูลของคุณถูกเก็บไว้ในบัญชีนี้เท่านั้น ไม่มีการแชร์หรือแสดงให้ผู้อื่นเห็น
        </div>
      </div>
    </div>
  );
}


function FitnessPlanner() {
  const [view, setView] = useState("dashboard");
  const [profile, setProfile] = useState(EMPTY_PROFILE);
  const [draftProfile, setDraftProfile] = useState(EMPTY_PROFILE);
  const [loaded, setLoaded] = useState(false);
  const [onboarded, setOnboarded] = useState(false); // overwritten once storage load resolves; loading spinner masks this either way
  const [split, setSplit] = useState([]);
  const [plan, setPlan] = useState([]);
  const [aiMeta, setAiMeta] = useState(null);
  const [aiStatus, setAiStatus] = useState("idle");
  const [activeDayIdx, setActiveDayIdx] = useState(0);
  const [progressLog, setProgressLog] = useState([]);
  const [completedLog, setCompletedLog] = useState([]);
  const [exerciseLog, setExerciseLog] = useState([]);
  const [avoidList, setAvoidList] = useState([]);
  const [sessionDayIdx, setSessionDayIdx] = useState(null);
  const [toast, setToast] = useState("");
  const [weightInput, setWeightInput] = useState("");

  useEffect(() => {
    (async () => {
      const [p, ps, pl, cl, el, al, ob] = await Promise.all([
        loadKey("fp-profile", EMPTY_PROFILE),
        loadKey("fp-plan-state", null),
        loadKey("fp-progress-log", []),
        loadKey("fp-completed-log", []),
        loadKey("fp-exercise-log", []),
        loadKey("fp-avoid-list", []),
        loadKey("fp-onboarded", false),
      ]);
      // Merge over EMPTY_PROFILE so a profile saved by an older version of this
      // app (missing newer fields like "equipment") never leaves a field undefined.
      const mergedProfile = { ...EMPTY_PROFILE, ...p };
      setProfile(mergedProfile);
      setDraftProfile(mergedProfile);
      if (ps) {
        setSplit(ps.split || []);
        setPlan(ps.plan || []);
        setAiMeta(ps.aiMeta || null);
        setAiStatus(ps.plan && ps.plan.length ? (ps.aiMeta && ps.aiMeta.rationale ? "done" : "error") : "idle");
      }
      setProgressLog(pl || []);
      setCompletedLog(cl || []);
      setExerciseLog(el || []);
      setAvoidList(al || []);
      // A profile saved before this welcome screen existed already counts as
      // "onboarded" — don't make a returning user re-enter their name.
      setOnboarded(!!ob || !!(p && p.name));
      setLoaded(true);
    })();
  }, []);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  }, []);

  const bmi = useMemo(() => calcBMI(profile.height, profile.weight), [profile.height, profile.weight]);
  const bmiCat = useMemo(() => bmiCategory(bmi), [bmi]);
  const missing = useMemo(() => validateProfile(profile), [profile]);
  const isProfileComplete = missing.length === 0;

  async function handleSaveProfile(next) {
    setProfile(next);
    setDraftProfile(next);
    await saveKey("fp-profile", next);
  }

  async function handleOnboard(name) {
    const trimmed = (name || "").trim();
    if (trimmed) {
      const next = { ...profile, name: trimmed };
      setProfile(next);
      setDraftProfile(next);
      await saveKey("fp-profile", next);
    }
    setOnboarded(true);
    await saveKey("fp-onboarded", true);
  }

  async function generateProgram() {
    const missingNow = validateProfile(profile);
    if (missingNow.length > 0) {
      showToast("กรอกข้อมูลให้ครบก่อนสร้างโปรแกรม");
      setView("setup");
      return;
    }
    setAiStatus("loading");
    const newSplit = buildSplit(Number(profile.daysPerWeek), profile.bodyParts);
    const pool = getEligibleExercises(profile.bodyParts, profile.level, profile.hasLimitation, profile.equipment, avoidList);
    const perDay = exercisesPerDay(profile.duration);

    const finalPlan = newSplit.map((day) => ({
      dayIndex: day.dayIndex, dayLabel: day.dayLabel, focus: day.focus,
      exercises: pickExercisesForDay(pool, day.parts, perDay, day.dayIndex).map((ex) => ex.id),
    }));
    const sr = (SET_REP_TABLE[profile.goal] && SET_REP_TABLE[profile.goal][profile.level]) || { sets: 3, reps: "10-12", restSec: 60 };
    const meta = generateLocalSummary(profile, finalPlan, sr, newSplit);

    setSplit(newSplit);
    setPlan(finalPlan);
    setAiMeta(meta);
    setAiStatus("done");
    await saveKey("fp-plan-state", { split: newSplit, plan: finalPlan, aiMeta: meta, generatedAt: new Date().toISOString() });
    setActiveDayIdx(0);
    setView("plan");
  }

  async function handleLogWeight() {
    const w = Number(weightInput);
    if (!w || w < 20 || w > 300) { showToast("กรอกน้ำหนักให้ถูกต้อง"); return; }
    const entry = { date: new Date().toISOString().slice(0, 10), weight: w };
    const next = [...progressLog.filter((e) => e.date !== entry.date), entry].sort((a, b) => a.date.localeCompare(b.date));
    setProgressLog(next);
    await saveKey("fp-progress-log", next);
    const nextProfile = { ...profile, weight: w };
    setProfile(nextProfile);
    setDraftProfile(nextProfile);
    await saveKey("fp-profile", nextProfile);
    setWeightInput("");
    showToast("บันทึกน้ำหนักแล้ว");
  }

  async function handleMarkComplete(dayIndex, dayLabel) {
    const today = new Date().toISOString().slice(0, 10);
    if (completedLog.some((c) => c.date === today && c.dayIndex === dayIndex)) {
      showToast("บันทึกไว้แล้วสำหรับวันนี้");
      return;
    }
    const next = [...completedLog, { date: today, dayIndex, dayLabel }];
    setCompletedLog(next);
    await saveKey("fp-completed-log", next);
    showToast("บันทึก Workout สำเร็จ");
  }

  // ---- exercise swap (used in Plan view and mid-session) ----
  async function handleSwapExercise(dayIndex, oldId, newId) {
    const nextPlan = plan.map((d) => (d.dayIndex === dayIndex ? { ...d, exercises: d.exercises.map((id) => (id === oldId ? newId : id)) } : d));
    setPlan(nextPlan);
    await saveKey("fp-plan-state", { split, plan: nextPlan, aiMeta, generatedAt: new Date().toISOString() });
  }

  // ---- pain flag: permanently avoid the exercise in future auto-generated plans ----
  async function handleFlagPain(exerciseId) {
    if (avoidList.includes(exerciseId)) return;
    const next = [...avoidList, exerciseId];
    setAvoidList(next);
    await saveKey("fp-avoid-list", next);
  }

  // ---- per-exercise weight/reps logging (from Session mode) ----
  async function handleLogExercise(entry) {
    const next = [...exerciseLog, { ...entry, date: new Date().toISOString().slice(0, 10) }];
    setExerciseLog(next);
    await saveKey("fp-exercise-log", next);
  }

  // ---- finish a guided session: mark day complete + close session, with an
  // achievement toast if this session unlocked a new one ----
  async function handleFinishSession(dayIndex, dayLabel) {
    const beforeStats = computeAdherenceStats(completedLog, profile.daysPerWeek);
    const beforeUnlocked = new Set(ACHIEVEMENTS.filter((a) => a.check(beforeStats, Number(profile.daysPerWeek))).map((a) => a.id));
    const today = new Date().toISOString().slice(0, 10);
    let nextCompleted = completedLog;
    if (!completedLog.some((c) => c.date === today && c.dayIndex === dayIndex)) {
      nextCompleted = [...completedLog, { date: today, dayIndex, dayLabel }];
      setCompletedLog(nextCompleted);
      await saveKey("fp-completed-log", nextCompleted);
    }
    const afterStats = computeAdherenceStats(nextCompleted, profile.daysPerWeek);
    const newlyUnlocked = ACHIEVEMENTS.find((a) => !beforeUnlocked.has(a.id) && a.check(afterStats, Number(profile.daysPerWeek)));
    setSessionDayIdx(null);
    showToast(newlyUnlocked ? `ปลดล็อกความสำเร็จ: ${newlyUnlocked.label}!` : "จบ Workout แล้ว เก่งมาก!");
  }

  const pool = useMemo(
    () => getEligibleExercises(profile.bodyParts, profile.level, profile.hasLimitation, profile.equipment, avoidList),
    [profile.bodyParts, profile.level, profile.hasLimitation, profile.equipment, avoidList]
  );
  const adherenceStats = useMemo(() => computeAdherenceStats(completedLog, profile.daysPerWeek), [completedLog, profile.daysPerWeek]);

  if (!loaded) {
    return (
      <div className="fp-root" style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
        <style>{GLOBAL_STYLES}</style>
        <Loader2 className="fp-spin" size={28} color="var(--accent)" />
      </div>
    );
  }

  if (!onboarded) {
    return (
      <div className="fp-root">
        <style>{GLOBAL_STYLES}</style>
        <LoginView onContinue={handleOnboard} />
      </div>
    );
  }

  if (sessionDayIdx !== null) {
    const sessionDay = plan.find((d) => d.dayIndex === sessionDayIdx);
    if (sessionDay) {
      return (
        <div className="fp-root">
          <style>{GLOBAL_STYLES}</style>
          <SessionView
            day={sessionDay} profile={profile} pool={pool} adherenceStats={adherenceStats}
            onExit={() => setSessionDayIdx(null)}
            onSwap={(oldId, newId) => handleSwapExercise(sessionDay.dayIndex, oldId, newId)}
            onLogExercise={handleLogExercise}
            onFlagPain={handleFlagPain}
            onFinish={() => handleFinishSession(sessionDay.dayIndex, sessionDay.dayLabel)}
          />
        </div>
      );
    }
    setSessionDayIdx(null);
  }

  return (
    <div className="fp-root">
      <style>{GLOBAL_STYLES}</style>
      <div className="fp-shell">
        <Sidebar view={view} setView={setView} />
        <main className="fp-main">
          {view === "dashboard" && (
            <DashboardView
              profile={profile} bmi={bmi} bmiCat={bmiCat} isProfileComplete={isProfileComplete}
              plan={plan} split={split} completedLog={completedLog} setView={setView}
              onMarkComplete={handleMarkComplete} onStartSession={setSessionDayIdx}
              adherenceStats={adherenceStats}
            />
          )}
          {view === "profile" && (
            <ProfileView draft={draftProfile} setDraft={setDraftProfile} onSave={handleSaveProfile} bmi={bmi} bmiCat={bmiCat} showToast={showToast} />
          )}
          {view === "setup" && (
            <SetupView
              draft={draftProfile} setDraft={setDraftProfile} onSave={handleSaveProfile}
              onGenerate={generateProgram} aiStatus={aiStatus} missing={missing}
            />
          )}
          {view === "plan" && (
            <PlanView
              plan={plan} aiMeta={aiMeta} aiStatus={aiStatus}
              activeDayIdx={activeDayIdx} setActiveDayIdx={setActiveDayIdx}
              onRegenerate={generateProgram} onMarkComplete={handleMarkComplete}
              completedLog={completedLog} profile={profile} pool={pool}
              onSwapExercise={handleSwapExercise} onStartSession={setSessionDayIdx}
              adherenceStats={adherenceStats}
            />
          )}
          {view === "schedule" && (
            <ScheduleView plan={plan} setView={setView} setActiveDayIdx={setActiveDayIdx} />
          )}
          {view === "progress" && (
            <ProgressView
              progressLog={progressLog} completedLog={completedLog} weightInput={weightInput}
              setWeightInput={setWeightInput} onLogWeight={handleLogWeight} split={split} profile={profile}
              exerciseLog={exerciseLog} adherenceStats={adherenceStats}
            />
          )}
        </main>
      </div>
      <BottomNav view={view} setView={setView} />
      {toast && <div className="fp-toast fp-fade-in"><CheckCircle2 size={15} color="var(--success)" />{toast}</div>}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<FitnessPlanner />);
</script>

  });
  var runScript = document.createElement("script");
  runScript.textContent = result.code;
  document.body.appendChild(runScript);

</script>
</body>
</html>
